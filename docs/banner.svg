<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bgHookah" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0808"/>
      <stop offset="50%" stop-color="#140f0c"/>
      <stop offset="100%" stop-color="#0d0908"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#78350f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="20" fill="url(#bgHookah)"/>
  
  <circle cx="160" cy="120" r="160" fill="#f59e0b" fill-opacity="0.10" filter="url(#glow)"/>
  <circle cx="1040" cy="300" r="160" fill="#d97706" fill-opacity="0.08" filter="url(#glow)"/>

  <rect x="1.5" y="1.5" width="1197" height="417" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Badge / Pill -->
  <g transform="translate(80, 60)">
    <rect width="210" height="30" rx="15" fill="#20150e" stroke="#3d2416" stroke-width="1"/>
    <circle cx="16" cy="15" r="5" fill="#fbbf24"/>
    <text x="32" y="20" fill="#fef3c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">LOUNGE &amp; FLAVOR LAB</text>
  </g>

  <!-- Title -->
  <text x="80" y="150" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">
    Hookah <tspan fill="url(#amberGlow)">iOS App</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="200" fill="#a8a29e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    Artisanal flavor mixology, intensity metrics, tobacco profiling and lounge discovery in Swift &amp; SwiftUI.
  </text>

  <!-- Stack Pills -->
  <g transform="translate(80, 255)">
    <rect width="150" height="38" rx="10" fill="#1b120c" stroke="#362215" stroke-width="1"/>
    <text x="20" y="24" fill="#f5f5f4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Swift · SwiftUI</text>

    <rect x="162" width="165" height="38" rx="10" fill="#1b120c" stroke="#362215" stroke-width="1"/>
    <text x="182" y="24" fill="#f5f5f4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Mix Breakdown</text>

    <rect x="339" width="165" height="38" rx="10" fill="#1b120c" stroke="#362215" stroke-width="1"/>
    <text x="359" y="24" fill="#f5f5f4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Custom PieCharts</text>

    <rect x="516" width="160" height="38" rx="10" fill="#1b120c" stroke="#362215" stroke-width="1"/>
    <text x="536" y="24" fill="#f5f5f4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Lounge Guides</text>
  </g>

  <!-- Visual Card Right Side -->
  <g transform="translate(810, 80)">
    <rect width="310" height="260" rx="16" fill="#0d0907" stroke="#2a190f" stroke-width="1.5"/>
    
    <text x="24" y="38" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">SIGNATURE BLEND</text>
    
    <!-- Blend Breakdown Card -->
    <g transform="translate(24, 60)">
      <rect width="262" height="60" rx="10" fill="#19110b"/>
      <circle cx="30" cy="30" r="16" fill="#b45309"/>
      <text x="23" y="35" fill="#ffffff" font-size="14">🔥</text>
      <text x="58" y="28" fill="#f5f5f4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Citrus Mint Velvet</text>
      <text x="58" y="46" fill="#a8a29e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Dark Leaf &amp; Blonde Mix</text>
      <text x="220" y="36" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">94%</text>
    </g>

    <g transform="translate(24, 132)">
      <rect width="262" height="50" rx="8" fill="#19110b"/>
      <text x="18" y="24" fill="#a8a29e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Intensity</text>
      <text x="18" y="40" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">●●●●○ Strong</text>
      <text x="140" y="24" fill="#a8a29e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Flavor Notes</text>
      <text x="140" y="40" fill="#f5f5f4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Grapefruit, Spearmint</text>
    </g>

    <g transform="translate(24, 196)">
      <rect width="262" height="42" rx="10" fill="#b45309"/>
      <text x="70" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Explore Mix Ratios</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 360)">
    <text x="0" y="0" fill="#78716c" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">
      Engineered by <tspan fill="#f5f5f4" font-weight="600">Ahmet Kadir Çiçek</tspan> · github.com/ahmetkadircicek/hookah
    </text>
  </g>
</svg>
